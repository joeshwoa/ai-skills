# n8n + Postgres + browserd on one server.  Copy .env.example → .env and fill it.   docker compose up -d
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment: { POSTGRES_USER: n8n, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: n8n }
    volumes: [pg:/var/lib/postgresql/data]
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on: [postgres, browserd]
    ports: ["127.0.0.1:5678:5678"]          # put Caddy/nginx/Cloudflare Tunnel in front for HTTPS
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: "${POSTGRES_PASSWORD}"
      DB_POSTGRESDB_DATABASE: n8n
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
      N8N_HOST: "${N8N_HOST}"
      N8N_PROTOCOL: https
      WEBHOOK_URL: "https://${N8N_HOST}/"
      GENERIC_TIMEZONE: Africa/Cairo
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    volumes: [n8n:/home/node/.n8n]
  browserd:
    build: { context: .., dockerfile: deploy/Dockerfile.browserd }
    restart: unless-stopped
    # NOT published to the internet: only n8n (same compose network) calls http://browserd:7788
    expose: ["7788"]
    environment:
      NX_ALLOW: "${NX_ALLOW}"               # e.g. supplier-portal.com,courier.example
      NX_TOKEN: "${NX_TOKEN}"               # long random; set the same value in an n8n Header Auth credential
    shm_size: 1gb
    volumes: [bd:/data]                     # sessions + recipes + downloads
volumes: { pg: {}, n8n: {}, bd: {} }
